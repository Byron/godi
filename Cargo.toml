[package]
name = "godi"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only"
description = "Seal, copy, and verify immutable data"

[features]
default = []
web = ["dep:axum", "dep:serde_json", "dep:tokio", "dep:webbrowser"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
glob = "0.3"
hex = "0.4"
md-5 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha1 = "0.10"
signal-hook = "0.3"

axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
webbrowser = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
